    RegisterInput:
      type: object
      required:
      - name
      - email
      - document
      - password
      description: Registro público de ciudadanos. Siempre crea un usuario con rol CONSULTOR y estado ACTIVO; cualquier otro
        campo enviado (por ejemplo admin) se ignora.
      properties:
        name:
          type: string
          minLength: 10
          maxLength: 100
        email:
          type: string
          format: email
        document:
          type: string
          minLength: 8
        password:
          type: string
          format: password
          description: Debe contener al menos una mayúscula, una minúscula y un dígito.
    ApiEnvelope:
      type: object
      properties:
        exito:
          type: boolean
        mensaje:
          type: string
        data: {}
