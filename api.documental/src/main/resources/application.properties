# Archivo de configuración para la aplicación Spring Boot
server.port=8080
spring.application.name=sigcapi

# Configuración de la base de datos MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sigcapi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración de seguridad para las cookies de sesión
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

storage.documents.path=${STORAGE_PATH:./storage/documents}
# Tamaño máximo de un solo archivo
spring.servlet.multipart.max-file-size=10MB
# Tamaño máximo del total de la petición (todos los archivos juntos + datos)
spring.servlet.multipart.max-request-size=20MB

# Desactivar recursos estáticos
spring.web.resources.add-mappings=false
# Lanzar excepción si la ruta no existe
spring.mvc.throw-exception-if-no-handler-found=true

#Variables de parametrización
com.sigcapi.security.max-failed-attempts=5
com.sigcapi.security.lock-duration-minutes=2
com.sigcapi.security.token.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}

# Variables para integración con Anthropic
anthropic.api.url=${ANTHROPIC_URL:https://api.anthropic.com/v1/messages}
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Configuración para el envío de correos electrónicos utilizando Gmail SMTP
# (lo usa el consumidor Kafka de notificaciones; con MAIL_ENABLED=false opera en modo simulado)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Administrador inicial (opcional): se crea al arrancar si las tres variables están definidas
com.sigcapi.bootstrap.admin.document=${ADMIN_DOCUMENT:}
com.sigcapi.bootstrap.admin.password=${ADMIN_PASSWORD:}
com.sigcapi.bootstrap.admin.email=${ADMIN_EMAIL:}
com.sigcapi.bootstrap.admin.name=${ADMIN_NAME:Administrador SIGC}

# ============================================================================
# Entrega 2 (P2) - Apache Kafka: integración orientada a eventos
# ============================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=sigcapi

# --- Productor: confirmación de todas las réplicas + productor idempotente (sin duplicados por reintentos de red)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000

# --- Consumidores: offsets confirmados por el contenedor tras procesar cada registro
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false

# --- Tópicos (también los crea el servicio kafka-init del docker-compose)
app.kafka.topics.request-events=${KAFKA_TOPIC_REQUEST_EVENTS:audit-events}
app.kafka.topics.request-events-dlt=${KAFKA_TOPIC_REQUEST_EVENTS_DLT:audit-events.DLT}
app.kafka.topics.partitions=3
app.kafka.topics.replicas=1
# 7 días para eventos, 30 días para mensajes fallidos
app.kafka.topics.retention-ms=604800000
app.kafka.topics.dlt-retention-ms=2592000000

# --- Grupos de consumidores (fan-out: cada grupo recibe todos los eventos)
app.kafka.consumers.audit-group=sigc-audit
app.kafka.consumers.notifications-group=sigc-notifications
app.kafka.consumers.dlt-group=sigc-dlt
app.kafka.consumers.concurrency=3
app.kafka.listeners.auto-startup=${KAFKA_LISTENERS_ENABLED:true}

# --- Reintentos del consumidor ante errores transitorios: 1 s, 2 s, 4 s y luego DLT
app.kafka.retry.max-retries=3
app.kafka.retry.initial-interval-ms=1000
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-interval-ms=10000

# --- Transactional Outbox (relay que publica los eventos confirmados en BD)
app.kafka.outbox.relay-enabled=${KAFKA_OUTBOX_RELAY_ENABLED:true}
app.kafka.outbox.relay-interval-ms=1000
app.kafka.outbox.relay-initial-delay-ms=5000
app.kafka.outbox.max-attempts=10
app.kafka.producer.send-timeout-ms=10000

# --- Notificaciones al ciudadano (consumidor sigc-notifications)
app.notifications.mail-enabled=${MAIL_ENABLED:false}
app.notifications.from=${EMAIL_USERNAME:}

# --- Logs: trazabilidad por evento (eventId / requestId en cada línea vía MDC)
logging.pattern.level=%5p [correlationId=%X{correlationId:-} eventId=%X{eventId:-} requestId=%X{requestId:-}]
logging.level.com.backend.sigcapi=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO

# ============================================================================
# Entrega final (P3) - Observabilidad y seguridad
# ============================================================================
# Actuator: solo health (público, sin detalles) e info/metrics (requieren ADMIN)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=SIGC API REST
info.app.version=3.0.0
# CORS explícito: orígenes permitidos separados por coma (nunca "*")
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
