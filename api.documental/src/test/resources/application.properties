spring.datasource.url=jdbc:h2:mem:sigcapi;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.mail.host=localhost
spring.mail.port=3025
storage.documents.path=target/test-documents
com.sigcapi.security.token.secret=test-secret-key-with-at-least-thirty-two-characters
com.sigcapi.security.max-failed-attempts=5
com.sigcapi.security.lock-duration-minutes=2
anthropic.api.url=http://localhost:9999/messages
anthropic.api.key=test-key

# Administrador inicial para las pruebas
com.sigcapi.bootstrap.admin.document=1000000000
com.sigcapi.bootstrap.admin.password=Admin.12345
com.sigcapi.bootstrap.admin.email=admin.pruebas@example.com
com.sigcapi.bootstrap.admin.name=Administrador Pruebas

# Kafka en pruebas: este archivo REEMPLAZA al application.properties principal en el classpath
# de pruebas. Por defecto los listeners y el relay quedan apagados para que las pruebas que no
# son de mensajería no necesiten broker; KafkaEventFlowIntegrationTest los activa con un broker
# Kafka embebido (@EmbeddedKafka).
spring.kafka.bootstrap-servers=localhost:59092
spring.kafka.admin.auto-create=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
app.kafka.topics.request-events=audit-events
app.kafka.topics.request-events-dlt=audit-events.DLT
app.kafka.listeners.auto-startup=false
app.kafka.outbox.relay-enabled=false
app.notifications.mail-enabled=false
logging.pattern.level=%5p [eventId=%X{eventId:-} requestId=%X{requestId:-}]
logging.level.org.apache.kafka=WARN
