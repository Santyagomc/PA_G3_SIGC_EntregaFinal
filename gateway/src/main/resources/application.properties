# SIGC Gateway GraphQL
server.port=${GATEWAY_PORT:8081}
spring.application.name=sigc-gateway

# GraphQL: endpoint /graphql y consola GraphiQL en /graphiql
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.printer.enabled=true

# API REST interna (en Docker Compose: http://api:8080)
app.api.base-url=${API_BASE_URL:http://localhost:8080}
app.api.connect-timeout-ms=${API_CONNECT_TIMEOUT_MS:2000}
app.api.read-timeout-ms=${API_READ_TIMEOUT_MS:5000}

# Resiliencia (ver ResilienceConfig)
app.resilience.retry.max-attempts=3
app.resilience.retry.initial-ms=300
app.resilience.cb.window=10
app.resilience.cb.min-calls=5
app.resilience.cb.failure-rate=50
app.resilience.cb.open-seconds=15

# Seguridad: mismo secreto HMAC que la API (variable de entorno, nunca en el repositorio en producción)
app.security.jwt-secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}

# Redis: caché de indicadores (TTL 30 s) y último valor de respaldo
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.cache.type=${CACHE_TYPE:redis}
spring.cache.cache-names=resumenIndicadores,volumenPorEstado
spring.cache.redis.time-to-live=30s
spring.cache.redis.key-prefix=sigc:gateway:
app.cache.stale-fallback-enabled=true

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=sigc-gateway
info.app.version=1.0.0
logging.pattern.level=%5p [correlationId=%X{correlationId:-}]
logging.level.com.sigc.gateway=INFO
